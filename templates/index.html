{% for post in posts %}

    <a href="{{ url_for('post', post_id=post['id']) }}">
        <h2>{{ post['titulo'] }}</h2>
    </a>

    <a href="{{ url_for('editar', id=post['id']) }}">
        <button type="button" class="btn btn-primary">
            Editar
        </button>
    </a>

    <button type="button" class="btn btn-secondary">
        {{ post['creado'] }}
    </button>

    <hr>

{% endfor %}
