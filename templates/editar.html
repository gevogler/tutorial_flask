{% extends 'base.html' %}

{% block content %}

<h1>{% block title %} Edit "{{ post['titulo'] }}" {% endblock %}</h1>

<form method="post">

    <div class="form-group">
        <label for="title">Título</label>
        <input type="text"
               name="title"
               class="form-control"
               value="{{ request.form['title'] or post['titulo'] }}">
    </div>

    <div class="form-group mt-2">
        <label for="content">Contenido</label>
        <textarea name="content"
                  class="form-control">{{ request.form['content'] or post['contenido'] }}</textarea>
    </div>

    <div class="form-group mt-3">
        <button type="submit" class="btn btn-primary">
            Guardar cambios
        </button>
    </div>

</form>

<hr>

<form action="{{ url_for('delete', id=post['id']) }}"
      method="POST"
      onsubmit="return confirm('¿Quieres eliminar esta entrada?')">

    <input type="submit"
           value="Eliminar entrada"
           class="btn btn-danger">

</form>

{% endblock %}
